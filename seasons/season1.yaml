# SEASON 1 - "The Crowning"
# King Aldric takes the throne of a brand-new kingdom. Introduces every mechanic one at a time
# (daily words, decree votes, lords, war), builds the king's character, plants the rival kingdom
# of Varn, peaks with the barbarian war, and ends on the first Reckoning.
#
# Day N's beat is the subject of day N's post (it starts the evening before).
# `note` is for you - what to film, say or prep. Run `./kingdom plan --plan seasons/season1.yaml` to see it all.

title: "The Crowning"
theme: "A new king. A new kingdom. Will they keep him?"
storyteller: fill        # random events only in quiet stretches between beats

beats:
  # ---------------------------------------------------------------- week 1: welcome, learn the controls
  - day: 1
    event: coronation
    announce: "Emberfall's gates are open. Follow to become a subject. Comment to live here."
    note: >
      LAUNCH POST. Caption explains the rules in 3 lines: follow = you live here; comment the
      words on each post; comment STATUS to see your subject. Pin a comment with the same.

  - day: 2
    pack: {WORK: work, TRADE: shop, TRAIN: train, GRUMBLE: protest}
    announce: "Your first real day in Emberfall. What will you do? (Or BECOME a new trade: BECOME BLACKSMITH)"
    note: "Reply to every STATUS comment yourself today - first impressions matter."

  - day: 3
    event: harvest_festival
    note: "Feature the hold with the most commenters."

  - day: 5
    event: first_decree
    agenda: "Your first decree: the people are voting WALLS or GRANARY. Back their choice or overrule them - either way, they will remember."
    note: >
      First decree vote (2 days). Day 5 post: the question. Day 6 post: the king has declared a side -
      does he agree with the people? Great hook: "The king just overruled you."

  # ---------------------------------------------------------------- week 2: first crisis, first scandal
  - day: 8
    event: bandits
    note: "First crisis. Show which hold got hit and who led the hunt."

  - day: 10
    event: merchant_caravan
    agenda: "A rich caravan from the east is at the gates. Tax them, or welcome them?"

  - day: 12
    if: "approval < 0.5"
    event: miners_strike
    else: {event: tournament}
    note: "If people are unhappy, the miners push back. If not, a tournament."

  - day: 14
    if: "has('court')"
    event: court_treason
    else: {event: bad_harvest}
    note: >
      TREASON. A REAL lord (a follower) is accused - the kingdom votes DUNGEON or PARDON. Keep it
      playful in the caption. If they're pardoned, Varn's spies show up two days later.

  # ---------------------------------------------------------------- week 3: midseason, then war
  - day: 15
    announce: "Halfway through Season 1."
    note: "Midseason recap video: loyalty chart, best moments, the first knights."

  - day: 16
    event: mocking_bard
    note: "The king's vanity episode. Use the king's speech line in the video."

  - day: 18
    event: barbarian_scouts
    agenda: "Barbarian scouts have been seen at the frontier."
    announce: "War is coming. Soldiers' FIGHT counts double - BECOME SOLDIER if you want to be a hero."
    note: >
      THE WAR ARC runs itself from here: scouts (2 days) -> raid on a hold (2 days) -> the horde at the
      gates (3 days, around days 22-24). Each step happens either way; how the crowd does decides how
      bad the next one is. Film the horde days as a trilogy.

  # ---------------------------------------------------------------- week 4: aftermath, then the Reckoning
  - day: 25
    if: "treasury < 0"
    event: empty_treasury
    note: "Only if the war emptied the treasury."

  - day: 26
    event: pretender
    agenda: "A stranger claims to be the true heir. The people are voting HEIR or KING."
    note: "Sets up the finale. If HEIR wins, the king walks into the Reckoning weakened."

  - day: 28
    event: royal_audience
    agenda: "The Reckoning is in two days. This audience is your last chance to win people over."
    announce: "The Reckoning is in 2 days."
    note: "Video: the king's speech. CHEER or JEER."

  - day: 30
    pack: packs/reckoning.yaml
    announce: "SEASON FINALE - THE RECKONING: KNEEL to keep the king, or REVOLT."
    note: >
      Finale. Results go up the next morning as the Season 2 opener - either the king survived, or he
      was overthrown and a new ruler takes the throne (edit content/ruler.yaml before day 31).
