# SEASON 2 - "The Rival Crown"  (outline - fill in after Season 1 shows what people like)
# Varn, the kingdom beyond the mountains, becomes the villain. A dragon wakes up.
# Day numbers are season days (day 1 = the first day of season 2).

title: "The Rival Crown"
theme: "Emberfall isn't alone anymore."
storyteller: fill

beats:
  - day: 1
    announce: "Season 2 begins. Whoever sits on the throne now has a problem: Varn."
    note: "Open on the Reckoning result. New ruler? Introduce them."

  - day: 3
    event: varn_envoy
    agenda: "Varn's envoy insulted Emberfall in front of the whole court."
    note: "Starts the Varn arc: envoy (vote) -> poaching -> treaty vote PEACE or WAR -> maybe war."

  - day: 12
    event: dragon_sighting
    note: "The dragon arc: sighting -> attack on a hold -> SLAY or PAY vote."

  - day: 20
    if: "result('varn_treaty') == 'PEACE'"
    event: merchant_caravan
    else: {event: bandits}

  - day: 28
    event: royal_audience
    announce: "The Reckoning is in 2 days."

  - day: 30
    pack: packs/reckoning.yaml
    announce: "THE RECKONING: KNEEL or REVOLT."
