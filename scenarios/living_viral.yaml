# The living world on a viral month: the account blows up in week 2 and a lot of people write their
# own moves (steal from, fight, gift each other). Watch the pace go from quiet to viral, and the
# crowd take over the post. The budget is set small here so the switch shows up even in rules mode.
kingdom: Emberfall
living: true
plan: seeds
days: 16
start_followers: 80
growth: {daily: 10, viral: [{day: 8, add: 1500}, {day: 9, add: 2500}, {day: 11, add: 3000}]}
engagement: 0.25
free_text: 0.4
balance:
  gpu_calls_per_hour: 16
