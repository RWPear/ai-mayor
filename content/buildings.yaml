# What the people want, and what share of them want it. A want is met by running buildings that serve it.
wants:
  food:     {share: 1.0,  pop: 1,  weight: 3, line: "something to eat"}
  water:    {share: 1.0,  pop: 5,  weight: 2, line: "clean water close by"}
  beer:     {share: 0.7,  pop: 8,  weight: 1, line: "a pint of something"}
  company:  {share: 0.6,  pop: 10, weight: 1, line: "somewhere to drink together"}
  tools:    {share: 0.4,  pop: 12, weight: 1, line: "proper tools"}
  bread:    {share: 0.6,  pop: 15, weight: 1, line: "fresh bread"}
  safety:   {share: 1.0,  pop: 15, weight: 2, line: "to feel safe at night"}
  faith:    {share: 0.4,  pop: 20, weight: 1, line: "somewhere to pray"}
  music:    {share: 0.5,  pop: 20, weight: 1, line: "music in the evenings"}
  trade:    {share: 0.5,  pop: 30, weight: 1, line: "somewhere to buy and sell"}
  wine:     {share: 0.3,  pop: 40, weight: 1, line: "wine, like proper people"}
  learning: {share: 0.25, pop: 60, weight: 1, line: "a school for the children"}
  comfort:  {share: 0.4,  pop: 80, weight: 1, line: "a hot bath"}
  pride:    {share: 0.0,  pop: 0,  weight: 0, line: "a king worth the name"}

# Your own house: free and automatic when you arrive. Your own gold (one coin a shift) can make it nicer.
