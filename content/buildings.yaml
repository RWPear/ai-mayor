# What Emberfall can build. There are no materials: a building costs PEOPLE (person-days of building work) and the
# GOLD put into it decides which version you get - a beer tent or a beer hall. Then it needs a CREW every day to
# run: a farm only feeds anyone on days ten people work it.
#
#   job      what the people who work it become (after a few days running it)
#   want     what it gives the people (see wants below); a running building covers `serves` people's worth of it
#   build    person-days to put it up (the first tier; each tier up takes half that again, times the tier)
#   crew     people a day to run it (less than that and it stands idle)
#   gold     gold a day into the treasury on days it runs
#   needs    another kind of building that has to be running too (no tavern without a brewery's beer)
#   pop      how many people Emberfall needs before anyone asks for it
#   tiers    by gold invested: the first tier's gold is the least it can be built for. x multiplies serves and gold
#   shape    how the 3D view draws it
keep:
  name: the keep
  job: steward
  want: pride
  build: 0
  crew: 0
  gold: 0
  pop: 0
  serves: 0
  shape: keep
  tiers:
    - {gold: 0, name: the shack, look: "a one-room shack with a roof that leaks", x: 1}
    - {gold: 60, name: Aldric's hall, look: "a long timber hall with a carved door", x: 1}
    - {gold: 300, name: the keep, look: "a square timber keep with a palisade round it", x: 1}
    - {gold: 1200, name: the castle, look: "a stone castle with four towers and a gatehouse", x: 1}
