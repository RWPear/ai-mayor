# Unlocked when the kingdom reaches a population. Each one is a new mechanic and a
# natural "we just unlocked X" episode. Features are checked in code by id.
#   silent_if: a condition; if true when it unlocks, it unlocks quietly (the story already covered it)
- {id: court,   pop: 25,    title: "The Royal Court",   text: "The king will name a lord for each hold - its most active, most loyal subject."}
- {id: roads,   pop: 75,    title: "The King's Road",   text: "Road projects can now be built."}
- {id: herald,  pop: 150,   title: "The Royal Herald",  text: "News travels fast now. Scandals hit harder."}
- {id: rival,   pop: 300,   title: "A Rival Crown",     text: "The Kingdom of Varn, beyond the mountains, has noticed Emberfall.",
   silent_if: "happened('varn_envoy') or active('varn_envoy')"}
- {id: tourney, pop: 600,   title: "Tourney Grounds",   text: "Emberfall is big enough to host a real tournament."}
- {id: castle,  pop: 1500,  title: "A Second Castle",   text: "The kingdom can build a second stronghold."}
- {id: realm,   pop: 5000,  title: "A Great Realm",     text: "Kingdoms from across the sea send envoys."}
- {id: empire,  pop: 20000, title: "Empire",            text: "Emberfall is no longer a kingdom. It is an empire."}
