# What the island can throw at Emberfall (the storyteller draws from these when the director isn't inventing
# events with the model). Each one asks the comments for something: words to help or hinder, or a vote.
#
#   when:      condition on stats (pop, approval, treasury, season_day, happened('id'), active('id'), built('name'))
#   scope:     city (all of Emberfall) or hold (one corner: Riverside, Hillfoot, Woodedge)
#   days:      how long the comments have
#   commands:  {WORD: help | hinder}, with help_needed (share of commenters) -> on_help, else on_timeout
#   choices:   {WORD: {text, effects...}} - the words are a vote; options with `side: WORD` let Aldric back one
#   options:   what Aldric can do about it (cost_pc x people, max 20 people's worth, out of his purse)
#
# Effects: mood, mood.hold, loyalty, treasury, treasury_pc, service.defense, stock.<food|wood|stone|clay|thatch|rope|
#          anything> (the island's stores), island: 1 (new land rises), wonder: "name | kind | what it is | its catch |
#          upkeep" (kind: creature, object, magic, place; upkeep: hungry, mischief, noisy, noticed, growing, or "")
# Text placeholders: {hold}, {resident} (a real @handle)

# =========================================================================== the island itself
- id: land_rises
  title: "The ground is shaking at the island's edge - something is rising out of the clouds"
  scope: city
  weight: 3
  when: "pop >= 3"
  days: 2
  commands: {EXPLORE: help, ROPE: help, HIDE: hinder}
  help_needed: 0.3
  on_help: {text: "New land rose from the clouds - and {resident} was the first to set foot on it.", island: 1, mood: 0.05}
  on_timeout: {text: "The rumbling stopped. Whatever was rising sank back into the clouds, unseen.", mood: -0.02}
  options:
    - {id: ropes, label: "Throw ropes and pull it in", cost_pc: 0, effects: {progress: 0.3}, text: "Aldric ran to the edge with every rope in Emberfall."}

- id: sky_whale
  title: "A sky-whale is drifting past the island, low enough to touch"
  scope: city
  weight: 2
  days: 1
  commands: {SING: help, WAVE: help, HIDE: hinder}
  help_needed: 0.25
  on_help: {text: "The sky-whale sang back. When it drifted off, it left something on the field.", mood: 0.08, wonder: "whale-song shell | object | a shell the size of a door that hums the whale's song | hums all night | noisy"}
  on_timeout: {text: "The sky-whale passed without a sound. Some say it looked sad.", mood: -0.02}

- id: falling_star
  title: "A star fell into the woods last night - and it's still glowing"
  scope: city
  weight: 2
  days: 2
  commands: {FETCH: help, DIG: help, AVOID: hinder}
  help_needed: 0.3
  on_help: {text: "{resident} dragged the fallen star out of the woods. It's starmetal - and still warm.", stock.starmetal: 3, mood: 0.04}
  on_timeout: {text: "The glow faded. By the time anyone looked, the crater was empty.", mood: -0.01}

- id: will_o_wisps
  title: "Little lights are dancing in the woods after dark"
  scope: hold
  weight: 2
  days: 2
  commands: {FOLLOW: help, IGNORE: hinder}
  help_needed: 0.25
  on_help: {text: "{resident} followed the lights all night and came back at dawn with pockets full of mushrooms that glow.", stock.food: 6, mood.hold: 0.05}
  on_timeout: {text: "The lights went away. Two goats went with them.", stock.food: -3}

- id: cloud_storm
  title: "A storm is rolling across the cloud sea toward the island"
  scope: city
  weight: 3
  days: 2
  while: {mood: -0.02}
  commands: {BRACE: help, TIE: help, PANIC: hinder}
  help_needed: 0.35
  on_help: {text: "Everything was tied down when the storm hit. Emberfall shook, and held.", mood: 0.05, loyalty: 0.03}
  on_timeout: {text: "The storm tore through the camp. Tents are in the trees and half the thatch is gone.", stock.thatch: -6, mood: -0.06}
  options:
    - {id: shack, label: "Everyone into the shack", cost_pc: 0, effects: {progress: 0.25}, text: "Aldric packed everyone into the shack. It was cosy. Too cosy."}

- id: edge_crumbling
  title: "The island's edge is crumbling near {hold}"
  scope: hold
  weight: 2
  days: 2
  commands: {SHORE: help, BUILD: help, FLEE: hinder}
  help_needed: 0.35
  on_help: {text: "{resident} and the others piled stone along the edge. It held.", mood.hold: 0.05, stock.stone: -4}
  on_timeout: {text: "A slice of {hold} broke off and fell into the clouds. Nobody was standing on it. Probably.", mood.hold: -0.06}

- id: door_in_the_hill
  title: "A door has appeared in the side of the rocky hill. It wasn't there yesterday."
  scope: city
  weight: 2
  days: 2
  choices:
    OPEN: {text: "They opened the door. Behind it: a staircase going down, and warm air that smells of bread.", wonder: "the door in the hill | place | a door in the rocky hill with stairs going down into the warm | something down there is baking | noticed", mood: 0.04}
    SEAL: {text: "They piled stones against the door. Sometimes, at night, someone knocks from the other side.", mood: -0.02}
  options:
    - {id: back_open, label: "Back OPEN", side: OPEN, cost_pc: 0, text: "Aldric wants to know what's down there."}
    - {id: back_seal, label: "Back SEAL", side: SEAL, cost_pc: 0, text: "Aldric says some doors are better left shut."}

- id: griffin_nest
  title: "A griffin is building a nest on the crag above the camp"
  scope: city
  weight: 2
  when: "pop >= 5"
  days: 2
  choices:
    BEFRIEND: {text: "The griffin stays. It eats a goat a week and nobody steals from Emberfall any more.", wonder: "the griffin on the crag | creature | a griffin nesting on the crag, watching everything | eats from the stores | hungry", service.defense: 0.1}
    SCARE: {text: "Pots, pans and shouting. The griffin left - and took the washing with it.", stock.rope: -3}
  options:
    - {id: back_friend, label: "Back BEFRIEND", side: BEFRIEND, cost_pc: 0, text: "Aldric has always wanted a griffin."}
    - {id: back_scare, label: "Back SCARE", side: SCARE, cost_pc: 0, text: "Aldric doesn't trust anything with that many claws."}

- id: wandering_wizard
  title: "A wizard in a soaked hat knocked on Aldric's door asking for a bed"
  scope: city
  weight: 2
  days: 2
  choices:
    WELCOME: {text: "The wizard stayed. He fixed the shack roof with one word and then slept for three days.", wonder: "the wizard in the shack | creature | an old wizard sleeping in Aldric's shack | eats like three men | hungry", mood: 0.05}
    REFUSE: {text: "The wizard left in a huff. It has rained over the shack, and only the shack, ever since.", mood: -0.03}
  options:
    - {id: back_welcome, label: "Back WELCOME", side: WELCOME, cost_pc: 0, text: "Aldric said there's always room by the fire."}
    - {id: back_refuse, label: "Back REFUSE", side: REFUSE, cost_pc: 0, text: "Aldric said they can barely feed themselves."}

- id: trading_airship
  title: "A trading airship has tied up at the edge of the island"
  scope: city
  weight: 2
  when: "pop >= 4"
  days: 2
  commands: {TRADE: help, HAGGLE: help, IGNORE: hinder}
  help_needed: 0.3
  on_help: {text: "The airship traders went home with a hold full of wood and left Emberfall richer.", treasury: 25, stock.wood: -6, mood: 0.03}
  on_timeout: {text: "The airship cast off. The traders said Emberfall wasn't worth the stop. Yet.", mood: -0.02}
  options:
    - {id: buy_nails, label: "Buy nails and tools", cost_pc: 1, effects: {progress: 0.2, stock.nails: 10}, text: "Aldric bought a sack of nails. He looks at them often."}

- id: cloud_mist
  title: "A thick cloud-mist has rolled over the island - people are getting lost"
  scope: city
  weight: 2
  days: 1
  commands: {LANTERN: help, CALL: help, WANDER: hinder}
  help_needed: 0.25
  on_help: {text: "Lanterns on poles all night. Everyone found their way home - {resident} found a little more than that.", mood: 0.03}
  on_timeout: {text: "The mist lifted at noon. Someone is still missing a boot, a goat and their sense of direction.", mood: -0.02}

- id: cough
  title: "A cough is going round the tents"
  scope: city
  weight: 2
  when: "pop >= 4"
  days: 3
  while: {mood: -0.02}
  commands: {TEND: help, BREW: help, COUGH: hinder}
  help_needed: 0.3
  on_help: {text: "{resident} brewed something foul from the springs. Everyone stopped coughing, mostly out of fear.", mood: 0.04}
  on_timeout: {text: "The cough ran its course. A miserable week for everyone in a tent.", mood: -0.05}

- id: first_feast
  title: "A run of fair weather - Emberfall wants a feast"
  scope: city
  weight: 2
  when: "pop >= 6"
  days: 1
  commands: {FEAST: help, COOK: help, SULK: hinder}
  help_needed: 0.25
  on_help: {text: "The first feast on the island. {resident} danced on a table. The table did not survive.", mood: 0.1, loyalty: 0.04, stock.food: -6}
  on_timeout: {text: "Nobody could agree on the food. There was no feast.", mood: -0.02}

- id: wolves
  title: "Wolves are prowling the edge of {hold} at night"
  scope: hold
  weight: 2
  days: 3
  champions: army
  while: {mood.hold: -0.03}
  commands: {HUNT: help, HIDE: hinder}
  help_needed: 0.45
  on_help: {text: "The wolves were driven back into the woods. {resident} kept a pelt.", mood.hold: 0.07}
  on_timeout: {text: "The wolves got into the stores in {hold}.", stock.food: -5, mood.hold: -0.05}

# =========================================================================== Skarn the Red (started by the war camp)
# He camps on a black crag of rock floating north of Emberfall, and his raiders cross on hide gliders.
- id: warlord_raid
  title: "{warlord}'s raiders are gliding across from the north - they're coming down on {hold}!"
  scope: hold
  planned_only: true
  days: 2
  champions: army
  on_start: {mood.hold: -0.08}
  while: {mood.hold: -0.03}
  commands: {FIGHT: help, FORTIFY: help, FLEE: hinder}
  help_needed: 0.45
  on_help: {text: "{hold} held! {resident} was first to the edge with a pitchfork. {warlord}'s raiders flapped home.",
            loyalty.hold: 0.06}
  on_timeout: {text: "{warlord}'s raiders burned the edge of {hold} and flew north with the food.", mood.hold: -0.12,
               stock.food: -8, loyalty.hold: -0.06}
  options:
    - {id: lead, label: "Aldric runs to {hold} with a torch", cost_pc: 0, effects: {progress: 0.25, loyalty.hold: 0.03}, text: "Aldric ran to {hold} waving a torch and shouting."}
    - {id: abandon, label: "Pull everyone back to the shack", cost_pc: 0, effects: {loyalty.hold: -0.1}, text: "Aldric pulled everyone back to the shack. {hold} is on its own."}

- id: warlord_horde
  title: "{warlord} AND HIS WHOLE HORDE ARE IN THE SKY OVER EMBERFALL"
  scope: city
  planned_only: true
  days: 3
  champions: army
  help_needed: 0.55
  on_start: {mood: -0.06}
  while: {mood: -0.03}
  commands: {FIGHT: help, FORTIFY: help, FLEE: hinder, SURRENDER: hinder}
  on_help: {text: "VICTORY! {warlord}'s horde broke against Emberfall. Songs will be sung about this day.",
            loyalty: 0.12, mood: 0.1}
  on_timeout: {text: "{warlord}'s horde sacked the edges of the island and flew off with the stores. Emberfall survives, barely.",
               loyalty: -0.12, mood: -0.08, stock.food: -15, stock.wood: -10}
  options:
    - {id: lead_charge, label: "Aldric leads the charge himself", cost_pc: 0, effects: {progress: 0.15, loyalty: 0.03}, text: "Aldric put a pot on his head and led the charge."}
    - {id: tribute, label: "Pay the horde to leave", cost_pc: 3, ends: true, effects: {loyalty: -0.08}, text: "Aldric paid {warlord} to go away. Nobody will let him forget it."}
